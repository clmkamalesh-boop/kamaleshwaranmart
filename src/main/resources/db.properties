# ====================================================================
# KamaleshwaranMart: Database & Connection Pool Configuration
# Anna University R2025 Semester 3 Java Capstone Project
# ====================================================================

# Database Mode (Default: mysql)
# Options: 'mysql' or 'h2'
db.type=mysql

# --------------------------------------------------------------------
# 1. MySQL Database Configuration (Primary)
# --------------------------------------------------------------------
# Update the database name, host, port, username and password below
# to match your local MySQL Server installation.
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/kamaleshwaranmart?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true&characterEncoding=UTF-8
db.username=root
db.password=root

# --------------------------------------------------------------------
# 2. H2 Embedded Database Configuration (Fallback / Standalone)
# --------------------------------------------------------------------
# To run in standalone mode without a running MySQL instance,
# set db.type=h2 or switch driver/url:
# db.driver=org.h2.Driver
# db.url=jdbc:h2:./data/kamaleshwaranmart;DB_CLOSE_DELAY=-1;MODE=LEGACY;NON_KEYWORDS=USER,VALUE
# db.username=sa
# db.password=

# --------------------------------------------------------------------
# 3. HikariCP Connection Pool Settings
# --------------------------------------------------------------------
pool.maximumPoolSize=10
pool.minimumIdle=2
pool.idleTimeout=30000
pool.connectionTimeout=20000
pool.maxLifetime=1800000
pool.poolName=KamaleshwaranMartHikariPool
